<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雅丹地貌形成过程模拟实验</title>
    <!-- 
    ========================================
    运行说明 / HOW TO RUN
    ========================================
    方式1: 直接双击此HTML文件在浏览器中打开（推荐）
    方式2: 使用本地服务器: npx serve . 然后访问 http://localhost:3000
    
    注意: 需要网络连接以加载Three.js 3D引擎
    ========================================
  -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="left-panel">
      <div class="panel-scan"></div>
      <div class="corner-decor tl"></div>
      <div class="corner-decor tr"></div>
      <div class="corner-decor bl"></div>
      <div class="corner-decor br"></div>
      <div class="header">
        <h1><span class="icon">🏜</span>雅丹地貌模拟系统</h1>
        <div class="subtitle">YARDANG LANDFORM SIMULATION v2.0</div>
      </div>
      <div class="panel-scroll">
        <div class="control-group">
          <label
            >实验进度 <span class="value-display" id="progress-val">0%</span></label
          >
          <input
            type="range"
            id="progress-slider"
            min="0"
            max="100"
            step="0.5"
            value="0"
          />
          <div class="stage-indicator">
            <span class="stage-dot active" data-stage="0">初始</span>
            <span class="stage-dot" data-stage="1">沉降</span>
            <span class="stage-dot" data-stage="2">沉积</span>
            <span class="stage-dot" data-stage="3">干裂</span>
            <span class="stage-dot" data-stage="4">侵蚀</span>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn" id="playBtn">▶ 播放</button>
          <button class="btn" id="resetBtn">↺ 重置</button>
        </div>
        <div class="tech-line"></div>
        <h2>地壳运动</h2>
        <div class="control-group">
          <label
            >下沉深度
            <span class="value-display" id="subsidence-val">2.0m</span></label
          >
          <input
            type="range"
            id="subsidence-slider"
            min="0.5"
            max="4.0"
            step="0.1"
            value="2.0"
          />
        </div>
        <h2>湖泊参数</h2>
        <div class="control-group">
          <label
            >水位高度 <span class="value-display" id="water-val">1.5m</span></label
          >
          <input
            type="range"
            id="water-slider"
            min="0.5"
            max="3.0"
            step="0.1"
            value="1.5"
          />
        </div>
        <div class="control-group">
          <label
            >沉积厚度
            <span class="value-display" id="sediment-val">1.0m</span></label
          >
          <input
            type="range"
            id="sediment-slider"
            min="0.3"
            max="2.0"
            step="0.1"
            value="1.0"
          />
        </div>
        <h2>气候暖干</h2>
        <div class="control-group">
          <label
            >干旱化速率 <span class="value-display" id="arid-val">1.0x</span></label
          >
          <input
            type="range"
            id="arid-slider"
            min="0.5"
            max="2.0"
            step="0.1"
            value="1.0"
          />
        </div>
        <h2>风蚀参数</h2>
        <div class="control-group">
          <label
            >风力强度 <span class="value-display" id="erosion-val">1.0</span></label
          >
          <input
            type="range"
            id="erosion-slider"
            min="0.1"
            max="2.0"
            step="0.1"
            value="1.0"
          />
        </div>
        <div class="control-group">
          <label
            >垄脊密度 <span class="value-display" id="density-val">10</span></label
          >
          <input
            type="range"
            id="density-slider"
            min="5"
            max="20"
            step="1"
            value="10"
          />
        </div>
        <div class="tech-line"></div>
        <h2>实验讲解</h2>
        <div id="explanation-box">
          欢迎使用<b>雅丹地貌模拟平台</b>。<br /><br />
          拖动进度条或点击<b>播放</b>开始模拟。<br /><br />
          <b>当前：</b>初始平原阶段
        </div>
      </div>
    </div>
    <div id="right-panel">
      <div class="scanline"></div>
      <div id="loading">
        <div class="loader"></div>
        加载3D场景...
      </div>
      <div class="weather-info">
        <div class="weather-row">
          <span class="weather-icon">🌡</span><span class="weather-label">温度</span
          ><span class="weather-value" id="temp-val">18°C</span>
        </div>
        <div class="weather-row">
          <span class="weather-icon">💧</span><span class="weather-label">湿度</span
          ><span class="weather-value" id="humid-val">45%</span>
        </div>
        <div class="weather-row">
          <span class="weather-icon">💨</span><span class="weather-label">风速</span
          ><span class="weather-value" id="wind-val">0 m/s</span>
        </div>
      </div>
      <div class="info-overlay">
        <div class="info-row">
          <span class="info-label">模拟时间</span
          ><span class="info-value" id="sim-time">0 万年</span>
        </div>
        <div class="info-row">
          <span class="info-label">当前阶段</span
          ><span class="info-value" id="sim-stage">初始平原</span>
        </div>
      </div>
      <div class="view-controls">
        <button class="view-btn" onclick="setView('top')" data-tip="俯视视角">
          ⬇
        </button>
        <button class="view-btn" onclick="setView('front')" data-tip="正面视角">
          ◯
        </button>
        <button class="view-btn" onclick="setView('side')" data-tip="侧面视角">
          ◐
        </button>
        <button
          class="view-btn active"
          onclick="setView('free')"
          data-tip="自由视角"
        >
          ◈
        </button>
        <button
          class="view-btn"
          onclick="toggleRotate()"
          id="rotateBtn"
          data-tip="自动旋转"
        >
          ↻
        </button>
      </div>
    </div>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
